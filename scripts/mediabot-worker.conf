# ─────────────────────────────────────────────────────────────
# Supervisor configuration for MediaBot Worker
# File: /etc/supervisor/conf.d/mediabot-worker.conf
# ─────────────────────────────────────────────────────────────

[program:mediabot-worker]
command=/usr/bin/php /var/www/mediabot/worker/worker.php --daemon
directory=/var/www/mediabot
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=30
killasgroup=true
stopasgroup=true
numprocs=2                          ; Run 2 parallel workers
process_name=%(program_name)s_%(process_num)02d
user=www-data
stdout_logfile=/var/www/mediabot/storage/logs/worker-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/www/mediabot/storage/logs/worker-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=HOME="/var/www",USER="www-data"

; ─────────────────────────────────────────────────────────────
; Supervisor group (manage all workers at once)
; supervisorctl restart mediabot:
; ─────────────────────────────────────────────────────────────
[group:mediabot]
programs=mediabot-worker
